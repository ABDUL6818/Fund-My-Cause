# GraphQL API Configuration
#
# All NEXT_PUBLIC_* variables are validated at startup with zod
# (see apps/interface/src/lib/env.ts). Invalid or missing values will
# cause the application to fail fast with a descriptive error.
#
# Validated variables:
#   NEXT_PUBLIC_GRAPHQL_ENDPOINT     - Required. Must be a valid URL.
#                                      Allowed protocols: http, https.
#   NEXT_PUBLIC_GRAPHQL_WS_ENDPOINT  - Required. Must be a valid URL.
#                                      Allowed protocols: ws, wss.
#
# Note: NEXT_PUBLIC_* values are inlined at build time, so they must be
# present when running `next build` as well as at runtime.

# Development
NEXT_PUBLIC_GRAPHQL_ENDPOINT=http://localhost:4000/graphql
NEXT_PUBLIC_GRAPHQL_WS_ENDPOINT=ws://localhost:4000/graphql

# Production (update accordingly)
# NEXT_PUBLIC_GRAPHQL_ENDPOINT=https://api.example.com/graphql
# NEXT_PUBLIC_GRAPHQL_WS_ENDPOINT=wss://api.example.com/graphql